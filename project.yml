name: FocusLog
options:
  bundleIdPrefix: com.focuslog
  developmentLanguage: ja
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: 4TKDWFY5W2
    CODE_SIGN_STYLE: Automatic
fileGroups:
  - Products.storekit
targets:
  FocusLog:
    type: application
    platform: iOS
    sources:
      - path: FocusLog
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.focuslog.app
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: FocusLog
        # 標準の暗号化しか使わないので、TestFlight・審査の輸出コンプライアンスの質問を省く。
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  FocusLogTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FocusLogTests
    dependencies:
      - target: FocusLog
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.focuslog.app.tests
  FocusLogUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: FocusLogUITests
    dependencies:
      - target: FocusLog
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.focuslog.app.uitests
        TEST_TARGET_NAME: FocusLog
schemes:
  FocusLog:
    build:
      targets:
        FocusLog: all
    test:
      config: Debug
      targets:
        - FocusLogTests
        - FocusLogUITests
      commandLineArguments:
        "-UITesting": true
    run:
      config: Debug
      storeKitConfiguration: Products.storekit
